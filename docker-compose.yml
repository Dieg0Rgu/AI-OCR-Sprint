version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: pdf_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: pdf_rag_ollama
    ports:
      - "11435:11434"
    volumes:
      - /var/snap/ollama/common/models:/root/.ollama/models:ro
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_rag_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_VISION_MODEL=moondream
      - VISION_MODEL=moondream
      - STORAGE_DIR=/app/storage
      - FALLBACK_EMBEDDINGS=true
    volumes:
      - ./backend/app:/app/app
      - document_storage:/app/storage
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf_rag_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_models:
  document_storage:

networks:
  default:
    name: pdf_rag_network
